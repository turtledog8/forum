<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<nav class="nav" th:fragment="nav">
    <a class="nav-brand" th:href="@{/}">Forum</a>

    <div class="nav-links" sec:authorize="isAuthenticated()">
        <a th:href="@{/posts}">Browse posts</a>
        <a th:href="@{/posts/new}">New post</a>
        <a th:href="@{/profile}">Profile</a>
        <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/users}">Admin</a>
        <span class="nav-user" sec:authentication="name">username</span>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="secondary">Log out</button>
        </form>
    </div>

    <div class="nav-links" sec:authorize="!isAuthenticated()">
        <a th:href="@{/login}">Log in</a>
        <a class="btn" th:href="@{/register}">Register</a>
    </div>
</nav>
</body>
</html>
