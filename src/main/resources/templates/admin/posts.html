<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage posts - Forum</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Manage posts</h1>

    <form class="inline" th:action="@{/admin/posts}" method="get">
        <label>
            Search
            <input type="text" name="search" placeholder="Search title or content" th:value="${search}">
        </label>
        <button type="submit">Search</button>
        <a class="btn secondary" th:href="@{/admin/posts}">Clear</a>
    </form>

    <table>
        <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Comments</th>
            <th>Likes</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${posts}">
            <td><a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">Title</a></td>
            <td th:text="${post.authorUsername}">author</td>
            <td th:text="${post.commentCount}">0</td>
            <td th:text="${post.likeCount}">0</td>
            <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}">date</td>
            <td>
                <form th:action="@{/admin/posts/{id}/delete(id=${post.id})}" method="post">
                    <button type="submit" class="danger">Delete</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(posts)}">
            <td colspan="6">No posts found.</td>
        </tr>
        </tbody>
    </table>

    <div class="pagination" th:if="${page != null}">
        <a th:if="${page.hasPrevious()}" th:href="@{/admin/posts(page=${page.number - 1}, search=${search})}">Previous</a>
        <span th:text="'Page ' + ${page.number + 1} + ' of ' + ${page.totalPages}">Page</span>
        <a th:if="${page.hasNext()}" th:href="@{/admin/posts(page=${page.number + 1}, search=${search})}">Next</a>
    </div>
</main>
</body>
</html>
