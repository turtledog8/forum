<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Forum</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<main class="container">
    <h1>Forum</h1>

    <p class="stat-strip">
        <span><strong th:text="${userCount}">0</strong> members</span>
        <span><strong th:text="${postCount}">0</strong> posts</span>
    </p>

    <h2>Browse by topic</h2>
    <div class="grid-2">
        <section class="card" th:each="section : ${categorySections}">
            <h3><a th:href="@{/posts(category=${section.key})}" th:text="${section.label}">Category</a></h3>

            <h4>Recent</h4>
            <ul class="stack">
                <li th:each="post : ${section.recentPosts}">
                    <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">Post title</a>
                </li>
                <li class="meta" th:if="${#lists.isEmpty(section.recentPosts)}">No posts yet.</li>
            </ul>

            <h4>Most commented</h4>
            <ul class="stack">
                <li th:each="post : ${section.topCommentedPosts}">
                    <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">Post title</a>
                </li>
                <li class="meta" th:if="${#lists.isEmpty(section.topCommentedPosts)}">No posts yet.</li>
            </ul>
        </section>
    </div>

    <h2>Across the whole forum</h2>
    <div class="grid-2">
        <section class="card">
            <h3>10 most recent posts</h3>
            <ul class="stack">
                <li th:each="post : ${recentPosts}">
                    <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">Post title</a>
                </li>
            </ul>
        </section>

        <section class="card">
            <h3>10 most commented posts</h3>
            <ul class="stack">
                <li th:each="post : ${mostCommentedPosts}">
                    <a th:href="@{/posts/{id}(id=${post.id})}" th:text="${post.title}">Post title</a>
                </li>
            </ul>
        </section>
    </div>
</main>
</body>
</html>
