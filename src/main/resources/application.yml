spring:
  application:
    name: forum

  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/forum?createDatabaseIfNotExist=true}
    username: ${FORUM_DB_USERNAME:root}
    password: ${FORUM_DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  thymeleaf:
    cache: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${SERVER_PORT:8080}

app:
  upload-dir: ${UPLOAD_DIR:uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.example.forum: DEBUG
